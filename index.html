<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKN Nábytek - HOMAG Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: #1e293b; border-b: 2px solid #334155; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logo { background-color: #005a9c; color: white; font-weight: bold; font-size: 20px; padding: 6px 14px; border-radius: 6px; letter-spacing: 1px; }
        .partner-tag { font-size: 11px; background: #0f172a; color: #38bdf8; padding: 4px 10px; border-radius: 12px; margin-left: 10px; border: 1px solid #005a9c; }
        
        .stats-bar { display: flex; gap: 15px; }
        .stat-card { background-color: #0f172a; border: 1px solid #334155; padding: 6px 16px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: #4ade80; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .left-panel { width: 320px; background-color: #1a2234; border-right: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .right-panel { flex: 1; padding: 20px; overflow-y: auto; background-color: #0f172a; }

        .craft-btn { background: linear-gradient(135deg, #005a9c, #0284c7); border: none; color: white; padding: 18px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 12px rgba(0,90,156,0.4); }
        .craft-btn:active { transform: scale(0.97); }

        .machine-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .machine-info h4 { font-size: 15px; color: #f8fafc; margin-bottom: 4px; }
        .machine-info p { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .machine-stats { font-size: 12px; color: #38bdf8; font-weight: bold; }
        
        .buy-btn { background-color: #16a34a; border: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        .buy-btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.5; }

        .job-card { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 6px; background-color: #334155; border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #f59e0b; width: 0%; }
        
        .section-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header>
        <div>
            <span class="logo">PKN NÁBYTEK</span>
            <span class="partner-tag">HOMAG GROUP</span>
        </div>
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Konto PKN</div>
                <div id="money" class="stat-value">500 Kč</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Výkon haly</div>
                <div id="pps" class="stat-value" style="color: #38bdf8;">0 Kč/s</div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="left-panel">
            <div class="section-title">Ruční výroba</div>
            <button class="craft-btn" onclick="manualCraft()">
                🪚 Vyrobit dílec ručně<br>
                <span style="font-size: 12px; font-weight: normal;">(+100 Kč)</span>
            </button>

            <div class="section-title" style="margin-top: 15px;">Aktivní zakázky</div>
            <div id="jobs-list"></div>
        </div>

        <div class="right-panel">
            <div class="section-title">Stroje a Technologie HOMAG</div>
            <div id="machines-list"></div>
        </div>
    </div>

    <script>
        let gameState = {
            money: 500,
            manualPower: 100,
            machines: {
                sawteq: { count: 0, basePrice: 1000, pps: 80, name: "Nářezové centrum HOMAG SAWTEQ B-300", desc: "Přesné dělení plošného materiálu s minimálním odpadem." },
                edgeteq: { count: 0, basePrice: 5000, pps: 450, name: "Olepovačka hran HOMAG EDGETEQ S-500", desc: "Bezspárové olepování hran s technologií airTec." },
                centateq: { count: 0, basePrice: 25000, pps: 2200, name: "CNC centrum HOMAG CENTATEQ P-110", desc: "5-osé CNC frézování a vrtání pro tvarové dílce." },
                loopteq: { count: 0, basePrice: 100000, pps: 9000, name: "Automatizace HOMAG LOOPTEQ O-300", desc: "Robotická manipulace s materiálem a automatický návrat." }
            },
            jobs: []
        };

        function calculatePPS() {
            let total = 0;
            for (let key in gameState.machines) {
                let m = gameState.machines[key];
                total += m.count * m.pps;
            }
            return total;
        }

        function manualCraft() {
            gameState.money += gameState.manualPower;
            updateUI();
        }

        function buyMachine(key) {
            let m = gameState.machines[key];
            let price = Math.floor(m.basePrice * Math.pow(1.2, m.count));
            if (gameState.money >= price) {
                gameState.money -= price;
                m.count++;
                updateUI();
            }
        }

        function renderMachines() {
            let container = document.getElementById('machines-list');
            container.innerHTML = '';

            for (let key in gameState.machines) {
                let m = gameState.machines[key];
                let price = Math.floor(m.basePrice * Math.pow(1.2, m.count));
                let canAfford = gameState.money >= price;

                let card = document.createElement('div');
                card.className = 'machine-card';
                card.innerHTML = `
                    <div class="machine-info">
                        <h4>${m.name} <span style="color:#005a9c;">(Vlastněno: ${m.count})</span></h4>
                        <p>${m.desc}</p>
                        <div class="machine-stats">+${(m.pps * (m.count + 1)).toLocaleString()} Kč/s</div>
                    </div>
                    <div>
                        <button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyMachine('${key}')">
                            Koupit za ${price.toLocaleString()} Kč
                        </button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function generateJob() {
            if (gameState.jobs.length >= 3) return;
            let job = {
                id: Date.now(),
                name: "Zakázka: " + ["Kuchyňská linka", "Vestavěná skříň", "Kanceláře", "Recepce hotelu"][Math.floor(Math.random()*4)],
                reward: Math.floor(2000 + Math.random() * 8000),
                duration: 6,
                progress: 0
            };
            gameState.jobs.push(job);
            renderJobs();
        }

        function renderJobs() {
            let container = document.getElementById('jobs-list');
            container.innerHTML = '';
            
            if (gameState.jobs.length === 0) {
                container.innerHTML = '<div style="font-size:12px; color:#64748b; text-align:center;">Čekání na zakázky...</div>';
                return;
            }

            gameState.jobs.forEach(job => {
                let card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
                        <span>${job.name}</span>
                        <span style="color:#4ade80;">+${job.reward.toLocaleString()} Kč</span>
                    </div>
                    <div class="progress-bar">
                        <div id="job-progress-${job.id}" class="progress-fill"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(gameState.money).toLocaleString() + " Kč";
            document.getElementById('pps').innerText = Math.floor(calculatePPS()).toLocaleString() + " Kč/s";
            renderMachines();
        }

        let lastTick = Date.now();
        setInterval(() => {
            let now = Date.now();
            let dt = (now - lastTick) / 1000;
            lastTick = now;

            let pps = calculatePPS();
            gameState.money += pps * dt;

            if (pps > 0) {
                for (let i = gameState.jobs.length - 1; i >= 0; i--) {
                    let job = gameState.jobs[i];
                    job.progress += dt;
                    let el = document.getElementById(`job-progress-${job.id}`);
                    if (el) {
                        el.style.width = Math.min(100, (job.progress / job.duration) * 100) + '%';
                    }
                    if (job.progress >= job.duration) {
                        gameState.money += job.reward;
                        gameState.jobs.splice(i, 1);
                        renderJobs();
                    }
                }
            }

            updateUI();
        }, 100);

        setInterval(generateJob, 5000);

        window.onload = () => {
            updateUI();
            generateJob();
        };
    </script>
</body>
</html>
